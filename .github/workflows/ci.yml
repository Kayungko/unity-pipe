# CI for unity-pipe (Go 1.23 single binary + Unity C# adapter package).
#
# C# note: package/com.unity.pipeline cannot be compile-verified here —
# neither local machines nor free GitHub-hosted runners have a Unity license.
# C# build/validation is deferred until Unity GameCI integration is added;
# no fake C# job is defined.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    name: Build, Vet & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three hosts matter: path/permission semantics fork between
        # Windows, Linux and macOS (ToSlash/FromSlash, read-only detection,
        # path discovery) — the v0.1.7 drive-letter tar-entry bug shipped
        # because only one host was ever exercised. The development host is
        # Windows; macOS is where many Unity Editor users actually run;
        # CI must cover all three.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Gofmt check
        shell: bash
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
        # Root-level layering_test.go and recipes_sync_test.go are part of ./...
        # and run automatically with the rest of the package tests.
