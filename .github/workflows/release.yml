name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag (vX.Y.Z)
        required: true
        type: string
      windows_sha256:
        description: SHA256 of the acceptance-tested Windows CLI
        required: true
        type: string
      upm_sha256:
        description: SHA256 of the acceptance-tested UPM package
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish the staged release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      WINDOWS_SHA: ${{ inputs.windows_sha256 }}
      UPM_SHA: ${{ inputs.upm_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify main, CI and the unpublished draft
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$WINDOWS_SHA" =~ ^[[:xdigit:]]{64}$ && "$UPM_SHA" =~ ^[[:xdigit:]]{64}$ ]]
          gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" --event push --status completed --json conclusion \
            | jq -e 'any(.[]; .conclusion == "success")'
          gh release view "$TAG" --json isDraft,tagName,targetCommitish \
            | jq -e --arg sha "$GITHUB_SHA" --arg tag "$TAG" '.isDraft and .tagName == $tag and .targetCommitish == $sha'
          gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            | jq -e --arg ref "refs/tags/$TAG" 'all(.[]; .ref != $ref)'

      - name: Download and verify staged files
        shell: bash
        run: |
          set -euo pipefail
          package="com.unity.pipeline-$(jq -er .version package/com.unity.pipeline/package.json).tgz"
          mkdir -p "$RUNNER_TEMP/staged"
          gh release download "$TAG" --pattern '*' --dir "$RUNNER_TEMP/staged"
          bash scripts/verify-release-assets.sh "$RUNNER_TEMP/staged" "$package" "$WINDOWS_SHA" "$UPM_SHA"
          ( cd "$RUNNER_TEMP/staged"; sha256sum * > "$RUNNER_TEMP/verified.sha256" )

      - name: Publish and verify the public download
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          tag_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" --jq .object.sha)
          [[ "$tag_commit" == "$GITHUB_SHA" ]]
          mkdir -p "$RUNNER_TEMP/published"
          gh release download "$TAG" --pattern '*' --dir "$RUNNER_TEMP/published"
          ( cd "$RUNNER_TEMP/published"; sha256sum * | diff "$RUNNER_TEMP/verified.sha256" - )
