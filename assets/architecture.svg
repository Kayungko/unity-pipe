<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 740">
  <!-- canvas -->
  <rect x="0" y="0" width="1680" height="740" fill="#0F172A"/>

  <!-- title -->
  <text x="60" y="68" font-size="26" font-weight="700" fill="#F8FAFC">upipe · 客户端分层</text>
  <text x="60" y="102" font-size="15" fill="#64748B">cli → commands → protocol ← transport · layering_test.go 强制单向依赖</text>

  <!-- Agent node -->
  <rect x="60" y="330" width="200" height="140" rx="14" fill="#1E293B" stroke="#64748B" stroke-width="2"/>
  <text x="160" y="390" font-size="22" font-weight="700" fill="#F8FAFC" text-anchor="middle">Agent / 人</text>
  <text x="160" y="424" font-size="14" fill="#94A3B8" text-anchor="middle">upipe &lt;cmd&gt;</text>

  <!-- upipe container -->
  <rect x="340" y="280" width="860" height="240" rx="16" fill="#0B1526" stroke="#334155" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="364" y="312" font-size="16" font-weight="700" fill="#38BDF8">upipe · Go 单二进制</text>

  <!-- cli layer -->
  <rect x="355" y="330" width="150" height="140" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="430" y="384" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle">cli</text>
  <text x="430" y="416" font-size="13" fill="#94A3B8" text-anchor="middle">分发 · 信封渲染</text>
  <text x="430" y="438" font-size="13" fill="#94A3B8" text-anchor="middle">退出码</text>

  <!-- commands layer -->
  <rect x="575" y="330" width="150" height="140" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="650" y="384" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle">commands</text>
  <text x="650" y="416" font-size="13" fill="#94A3B8" text-anchor="middle">子命令等待策略</text>

  <!-- protocol layer (core) -->
  <rect x="795" y="320" width="170" height="160" rx="12" fill="#064E3B" stroke="#34D399" stroke-width="3"/>
  <text x="880" y="374" font-size="24" font-weight="700" fill="#ECFDF5" text-anchor="middle">protocol</text>
  <text x="880" y="404" font-size="13" fill="#A7F3D0" text-anchor="middle">模型 · 端点 · 发现</text>
  <text x="880" y="426" font-size="13" fill="#A7F3D0" text-anchor="middle">重试梯 · 轮询状态机</text>
  <text x="880" y="448" font-size="13" fill="#A7F3D0" text-anchor="middle">零 IO · 移植边界</text>

  <!-- transport layer -->
  <rect x="1035" y="330" width="150" height="140" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="1110" y="384" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle">transport</text>
  <text x="1110" y="412" font-size="13" fill="#94A3B8" text-anchor="middle">net/http keep-alive</text>
  <text x="1110" y="434" font-size="13" fill="#94A3B8" text-anchor="middle">Transport 接口</text>
  <text x="1110" y="456" font-size="13" fill="#94A3B8" text-anchor="middle">唯一 IO 点</text>

  <!-- Editor node -->
  <rect x="1360" y="320" width="240" height="160" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="3"/>
  <text x="1480" y="380" font-size="24" font-weight="700" fill="#F8FAFC" text-anchor="middle">Unity Editor</text>
  <text x="1480" y="412" font-size="14" fill="#94A3B8" text-anchor="middle">com.unity.pipeline</text>
  <text x="1480" y="438" font-size="13" fill="#94A3B8" text-anchor="middle">包内 HTTP API</text>

  <!-- edges -->
  <line x1="260" y1="400" x2="349" y2="400" stroke="#64748B" stroke-width="2.5"/>
  <polygon points="349,393 361,400 349,407" fill="#64748B"/>
  <text x="305" y="386" font-size="12" fill="#94A3B8" text-anchor="middle">upipe &lt;cmd&gt;</text>

  <line x1="505" y1="400" x2="563" y2="400" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="563,393 575,400 563,407" fill="#38BDF8"/>

  <line x1="725" y1="400" x2="783" y2="400" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="783,393 795,400 783,407" fill="#38BDF8"/>
  <text x="757" y="386" font-size="12" fill="#94A3B8" text-anchor="middle">纯逻辑依赖</text>

  <line x1="965" y1="384" x2="1023" y2="384" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="1023,377 1035,384 1023,391" fill="#38BDF8"/>
  <line x1="1035" y1="416" x2="977" y2="416" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="977,409 965,416 977,423" fill="#38BDF8"/>

  <line x1="1185" y1="400" x2="1348" y2="400" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="1348,393 1360,400 1348,407" fill="#38BDF8"/>
  <text x="1272" y="372" font-size="13" fill="#94A3B8" text-anchor="middle">Bearer + 端口文件</text>
  <text x="1272" y="392" font-size="12" fill="#64748B" text-anchor="middle">127.0.0.1:7800~7849</text>

  <!-- footnote -->
  <text x="60" y="700" font-size="14" fill="#475569">零第三方依赖 · 纯 Go 标准库 · protocol 层零 IO —— 未来 daemon 化 / 换语言移植的机械翻译边界</text>
</svg>
